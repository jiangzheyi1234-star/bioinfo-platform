name: CI

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  diff_hygiene:
    name: diff / whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whitespace in changed diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r "${GITHUB_SHA}"
          fi

  python_windows:
    name: python / windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run Python quality gates
        shell: pwsh
        run: |
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-cache"
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "bio-ui-uv-venv"
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "uv-python"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata/Roaming"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "appdata/Local"
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          Remove-Item Env:\UV_PYTHON -ErrorAction SilentlyContinue
          uv python install 3.12
          uv sync --frozen --group dev
          uv run --frozen ruff check apps core scripts tests
          uv run --frozen python -m pytest -q

  security_governance:
    name: security / governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      npm_config_registry: https://registry.npmjs.org
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run security governance audit
        run: python scripts/security_governance_audit.py

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/bio-ui-uv-venv"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          unset UV_PYTHON
          uv python install 3.12
          uv export --frozen --group dev --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --progress-spinner off --strict --ignore-vuln CVE-2026-44405

      - name: Audit root npm lockfile
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate --package-lock-only

      - name: Audit web npm lockfile
        working-directory: apps/web
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate --package-lock-only

      - name: Audit desktop npm lockfile
        working-directory: apps/desktop
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate --package-lock-only

  dependency_review:
    name: security / dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  web_windows:
    name: web / windows
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

  linux_parity_smoke:
    name: python / linux parity
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run Linux parity smoke tests
        shell: bash
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/bio-ui-uv-venv"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          unset UV_PYTHON
          uv python install 3.12
          uv sync --frozen --group dev
          uv run --frozen python -m pytest -q \
            tests/test_remote_runner_install_lock.py \
            tests/test_remote_runner_mutable_layout.py \
            tests/test_remote_runner_process_owner.py \
            tests/test_remote_runner_protocol_startup.py \
            tests/test_remote_runner_release_gate.py \
            tests/test_runner_process_lifetime_lock.py \
            tests/test_release_manifest_traceability.py \
            tests/test_workflow_runtime_artifact_build_script.py \
            tests/test_update_remote_runner_release_manifest.py

  activation_storage_linux:
    name: python / activation-storage-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Inspect Linux storage boundary
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          findmnt -T "$RUNNER_TEMP" -o TARGET,FSTYPE,OPTIONS
          stat -f -c 'filesystem=%T magic=%t' "$RUNNER_TEMP"

      - name: Prove activation journal syscalls and recovery
        shell: bash
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/bio-ui-uv-venv"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          export H2OMETA_REQUIRE_LINUX_ACTIVATION_STORAGE_TESTS=1
          export H2OMETA_REQUIRE_LINUX_RELEASE_PUBLICATION_TESTS=1
          export H2OMETA_REQUIRE_LINUX_RELEASE_ARCHIVE_INSPECTION_TESTS=1
          export H2OMETA_REQUIRE_LINUX_RELEASE_MATERIALIZATION_IO_TESTS=1
          BIND_PROOF_ROOT="$RUNNER_TEMP/release-publication-bind-proof"
          mkdir -p "$BIND_PROOF_ROOT/parent/child" "$BIND_PROOF_ROOT/source"
          sudo mount --bind "$BIND_PROOF_ROOT/source" "$BIND_PROOF_ROOT/parent/child"
          cleanup_bind_proof() {
            sudo umount "$BIND_PROOF_ROOT/parent/child"
          }
          trap cleanup_bind_proof EXIT
          export H2OMETA_RELEASE_PUBLICATION_BIND_PARENT="$BIND_PROOF_ROOT/parent"
          export H2OMETA_RELEASE_MATERIALIZATION_BIND_PARENT="$BIND_PROOF_ROOT/parent"
          mountpoint -q "$BIND_PROOF_ROOT/parent/child"
          findmnt -T "$BIND_PROOF_ROOT/parent/child" -o TARGET,SOURCE,FSTYPE,OPTIONS
          unset UV_PYTHON
          uv python install 3.12
          uv sync --frozen --group dev
          uv run --frozen python -c 'import sys; assert sys.platform == "linux"'
          uv run --frozen python -m pytest -q \
            --basetemp "$RUNNER_TEMP/activation-storage-pytest" \
            tests/test_remote_runner_activation_installation_storage_contract.py \
            tests/test_remote_runner_activation_installation_storage_linux.py \
            tests/test_remote_runner_activation_registry_storage_contract.py \
            tests/test_remote_runner_activation_registry_storage_linux.py \
            tests/test_remote_runner_activation_config_integrity_key_storage_contract.py \
            tests/test_remote_runner_activation_config_integrity_key_storage_linux.py \
            tests/test_runner_activation_release_archive_contract.py \
            tests/test_runner_activation_release_archive_binding.py \
            tests/test_remote_runner_activation_release_tar_inspection.py \
            tests/test_remote_runner_activation_release_archive_inspection_contract.py \
            tests/test_remote_runner_activation_release_archive_inspection_linux.py \
            tests/test_remote_runner_activation_release_materialization_io_contract.py \
            tests/test_remote_runner_activation_release_materialization_io_linux.py \
            tests/test_runner_activation_release_publication_contract.py \
            tests/test_remote_runner_activation_release_publication_layout_contract.py \
            tests/test_remote_runner_activation_release_publication_layout_linux.py

  native_activation_fd_owner_linux:
    name: python / native-activation-fd-owner-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build and prove quarantined abi3 directory owners
        shell: bash
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/bio-ui-uv-venv"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          unset UV_PYTHON
          uv python install 3.12
          uv venv --python 3.12 "$UV_PROJECT_ENVIRONMENT"
          uv sync --frozen --group dev
          uv python install 3.13
          uv python install 3.14
          PYTHON312="$(uv python find 3.12)"
          PYTHON313="$(uv python find 3.13)"
          PYTHON314="$(uv python find 3.14)"
          "$PYTHON312" -c 'import sys, sysconfig; assert sys.version_info[:2] == (3, 12); assert not sysconfig.get_config_var("Py_GIL_DISABLED")'
          "$PYTHON313" -c 'import sys, sysconfig; assert sys.version_info[:2] == (3, 13); assert not sysconfig.get_config_var("Py_GIL_DISABLED")'
          "$PYTHON314" -c 'import sys, sysconfig; assert sys.version_info[:2] == (3, 14); assert not sysconfig.get_config_var("Py_GIL_DISABLED")'

          NATIVE_SOURCE="$GITHUB_WORKSPACE/native/activation_fd_owner"
          BUILD_CONSTRAINT="$NATIVE_SOURCE/build-constraints.txt"
          PROD_SOURCE="$RUNNER_TEMP/native-owner-prod-source"
          PROOF_SOURCE="$RUNNER_TEMP/native-owner-proof-source"
          PROD_WHEELS="$RUNNER_TEMP/native-owner-prod-wheels"
          PROOF_WHEELS="$RUNNER_TEMP/native-owner-proof-wheels"
          cp -a "$NATIVE_SOURCE" "$PROD_SOURCE"
          cp -a "$NATIVE_SOURCE" "$PROOF_SOURCE"
          mkdir -p "$PROD_WHEELS" "$PROOF_WHEELS"
          uv build --wheel "$PROD_SOURCE" \
            --out-dir "$PROD_WHEELS" \
            --python "$PYTHON312" \
            --build-constraint "$BUILD_CONSTRAINT" \
            --require-hashes
          uv build --wheel "$PROOF_SOURCE/proof" \
            --out-dir "$PROOF_WHEELS" \
            --python "$PYTHON312" \
            --build-constraint "$BUILD_CONSTRAINT" \
            --require-hashes

          mapfile -t prod_wheel_set < <(find "$PROD_WHEELS" -maxdepth 1 -type f -name '*.whl')
          mapfile -t proof_wheel_set < <(find "$PROOF_WHEELS" -maxdepth 1 -type f -name '*.whl')
          test "${#prod_wheel_set[@]}" -eq 1
          test "${#proof_wheel_set[@]}" -eq 1
          PROD_WHEEL="${prod_wheel_set[0]}"
          PROOF_WHEEL="${proof_wheel_set[0]}"
          PROD_SITE="$RUNNER_TEMP/native-owner-prod-site"
          PROOF_SITE="$RUNNER_TEMP/native-owner-proof-site"
          "$PYTHON312" scripts/validate_native_activation_fd_owner_wheel.py \
            --wheel "$PROD_WHEEL" \
            --site "$PROD_SITE" \
            --python "$PYTHON312" \
            --python "$PYTHON313" \
            --python "$PYTHON314"
          "$PYTHON312" scripts/validate_native_activation_fd_owner_wheel.py \
            --wheel "$PROOF_WHEEL" \
            --site "$PROOF_SITE" \
            --python "$PYTHON312" \
            --python "$PYTHON313" \
            --python "$PYTHON314" \
            --testing
          uvx --from abi3audit==0.0.26 abi3audit --strict "$PROD_WHEEL" "$PROOF_WHEEL"

          BIND_PROOF_ROOT="$RUNNER_TEMP/native-owner-bind-proof"
          mkdir -p \
            "$BIND_PROOF_ROOT/parent/child" \
            "$BIND_PROOF_ROOT/parent/foreign" \
            "$BIND_PROOF_ROOT/source"
          sudo chown root:root "$BIND_PROOF_ROOT/parent/foreign"
          sudo chmod 0755 "$BIND_PROOF_ROOT/parent/foreign"
          test "$(stat -c %u "$BIND_PROOF_ROOT/parent/foreign")" -eq 0
          sudo mount --bind "$BIND_PROOF_ROOT/source" "$BIND_PROOF_ROOT/parent/child"
          cleanup_native_owner_bind() {
            sudo umount "$BIND_PROOF_ROOT/parent/child"
          }
          trap cleanup_native_owner_bind EXIT
          export H2OMETA_REQUIRE_NATIVE_ACTIVATION_FD_OWNER_TESTS=1
          export H2OMETA_NATIVE_ACTIVATION_FD_OWNER_PROOF_SITE="$PROOF_SITE"
          export H2OMETA_NATIVE_ACTIVATION_FD_OWNER_BIND_PARENT="$BIND_PROOF_ROOT/parent"
          mountpoint -q "$BIND_PROOF_ROOT/parent/child"
          findmnt -T "$BIND_PROOF_ROOT/parent/child" -o TARGET,SOURCE,FSTYPE,OPTIONS
          uv run --frozen python -m pytest -q \
            --basetemp "$RUNNER_TEMP/native-owner-contract-pytest" \
            tests/test_native_activation_fd_owner_contract.py \
            tests/test_native_activation_fd_owner_leaf_contract.py \
            tests/test_native_activation_fd_owner_wheel_validator.py

          for entry in \
            "3.12:$PYTHON312" \
            "3.13:$PYTHON313" \
            "3.14:$PYTHON314"; do
            minor="${entry%%:*}"
            python="${entry#*:}"
            export H2OMETA_NATIVE_EXPECTED_PYTHON_MINOR="$minor"
            uv run --isolated --frozen --group dev --python "$python" \
              python -m pytest -q \
              --basetemp "$RUNNER_TEMP/native-owner-pytest-$minor" \
              tests/test_native_activation_fd_owner_linux.py \
              tests/test_native_activation_fd_owner_leaf_linux.py
          done

          if find apps/remote_runner core native -type f \
            \( -name '*.so' -o -name '*.pyd' -o -name '*.o' -o -name '*.whl' \) \
            -print -quit | grep -q .; then
            echo "native build output escaped RUNNER_TEMP" >&2
            exit 1
          fi
          if find apps/remote_runner core native -type d \
            \( -name build -o -name dist -o -name '*.egg-info' \) \
            -print -quit | grep -q .; then
            echo "native build directory escaped RUNNER_TEMP" >&2
            exit 1
          fi

  ci_green:
    name: required / ci-green
    if: ${{ always() }}
    needs:
      - diff_hygiene
      - python_windows
      - security_governance
      - dependency_review
      - web_windows
      - linux_parity_smoke
      - activation_storage_linux
      - native_activation_fd_owner_linux
    runs-on: ubuntu-24.04
    env:
      DIFF_HYGIENE_RESULT: ${{ needs.diff_hygiene.result }}
      PYTHON_WINDOWS_RESULT: ${{ needs.python_windows.result }}
      SECURITY_GOVERNANCE_RESULT: ${{ needs.security_governance.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
      WEB_WINDOWS_RESULT: ${{ needs.web_windows.result }}
      LINUX_PARITY_SMOKE_RESULT: ${{ needs.linux_parity_smoke.result }}
      ACTIVATION_STORAGE_LINUX_RESULT: ${{ needs.activation_storage_linux.result }}
      NATIVE_ACTIVATION_FD_OWNER_LINUX_RESULT: ${{ needs.native_activation_fd_owner_linux.result }}
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for job in \
            "diff-hygiene:${DIFF_HYGIENE_RESULT}" \
            "python-windows:${PYTHON_WINDOWS_RESULT}" \
            "security-governance:${SECURITY_GOVERNANCE_RESULT}" \
            "dependency-review:${DEPENDENCY_REVIEW_RESULT}" \
            "web-windows:${WEB_WINDOWS_RESULT}" \
            "linux-parity-smoke:${LINUX_PARITY_SMOKE_RESULT}" \
            "activation-storage-linux:${ACTIVATION_STORAGE_LINUX_RESULT}" \
            "native-activation-fd-owner-linux:${NATIVE_ACTIVATION_FD_OWNER_LINUX_RESULT}"
          do
            name="${job%%:*}"
            result="${job#*:}"
            echo "$name => $result"
            if [[ "$name" == "activation-storage-linux" || "$name" == "native-activation-fd-owner-linux" ]]; then
              if [[ "$result" != "success" ]]; then
                failed=1
              fi
            elif [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done
          exit "$failed"
